name: CRM CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node tests and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use stable Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Run CRM tests
        run: node --test crm/tests/*.test.mjs

      - name: Check production JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check propiedades/propiedades.js
          node --check casos-reales/casos-reales.js
          node --check crm/app.js
          node --check crm/backend.js
          node --check media-config.js
